name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish or update an explicitly reviewed package
        required: true
        default: publish
        type: choice
        options:
          - publish
          - add_platform
          - replace_windows
      staging_release_id:
        description: Owner-created unpublished staging draft ID (add_platform only)
        required: false
        type: string
      staging_asset_ids:
        description: Three exact temporary asset IDs (replace_windows only)
        required: false
        type: string
      version:
        description: Accepted release version (for example 0.0.3-dev.1 or 0.0.3)
        required: true
        type: string
      expected_commit:
        description: Exact reviewed and signed public commit
        required: true
        type: string
      approve_publication:
        description: Approve this exact version's package and release notes for publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ozimellow/kin-clinet' && github.actor == 'ozimellow' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      STAGING_RELEASE_ID: ${{ inputs.staging_release_id }}
      STAGING_ASSET_IDS: ${{ inputs.staging_asset_ids }}
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      APPROVE_PUBLICATION: ${{ inputs.approve_publication }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publication identity
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVE_PUBLICATION" = true
          [[ "$RELEASE_OPERATION" == publish || "$RELEASE_OPERATION" == add_platform || "$RELEASE_OPERATION" == replace_windows ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev\.[1-9][0-9]*)?$ ]]
          if [[ "$RELEASE_VERSION" == *-dev.* ]]; then
            test "$GITHUB_REF" = refs/heads/development
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)" = "$EXPECTED_COMMIT"
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/signers
          test "$(git log -1 --format='%an|%ae|%cn|%ce')" = 'ozimellow|119267804+ozimellow@users.noreply.github.com|ozimellow|119267804+ozimellow@users.noreply.github.com'
          test "$(git for-each-ref --format='%(taggername)|%(taggeremail:trim)' "refs/tags/v$RELEASE_VERSION")" = 'ozimellow|119267804+ozimellow@users.noreply.github.com'
          git verify-commit HEAD
          git verify-tag "v$RELEASE_VERSION"
          if [[ "$RELEASE_OPERATION" = publish ]]; then
            test "$(git rev-parse "v$RELEASE_VERSION^{commit}")" = "$EXPECTED_COMMIT"
            test -z "$STAGING_RELEASE_ID"
            test -z "$STAGING_ASSET_IDS"
            test -f "releases/v$RELEASE_VERSION/release.json"
            test -f "releases/v$RELEASE_VERSION/release.md"
          elif [[ "$RELEASE_OPERATION" = add_platform ]]; then
            test -z "$STAGING_ASSET_IDS"
            [[ "$STAGING_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
            test -f "releases/linux/v$RELEASE_VERSION/release.json"
            test -f "releases/linux/v$RELEASE_VERSION/release.md"
          else
            test "$GITHUB_REF" = refs/heads/main
            test -z "$STAGING_RELEASE_ID"
            [[ "$STAGING_ASSET_IDS" =~ ^[1-9][0-9]*,[1-9][0-9]*,[1-9][0-9]*$ ]]
            test -f "releases/windows/v$RELEASE_VERSION/release.json"
            test -f "releases/windows/v$RELEASE_VERSION/release.md"
          fi
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          allowed = {'.gitignore', '.gitattributes', 'LICENSE', 'README.md', 'logo.svg', 'logo-dark.svg',
                     '.github/workflows/release.yml', '.github/signers', '.github/scripts/verify-release.py',
                     'update-policy.json', 'update-policy.json.sig',
                     'releases/linux/update-policy.json', 'releases/linux/update-policy.json.sig'}
          import re
          paths = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD']).decode().splitlines()
          assert all(p in allowed or re.fullmatch(r'releases/(?:(?:linux|windows)/)?v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-dev\.[1-9][0-9]*)?/release\.(json|md)', p) for p in paths), 'Unexpected public source path'
          import json
          for prefix, scope in [('', 'shared'), ('releases/linux/', 'linux')]:
              policy_paths = {prefix + 'update-policy.json', prefix + 'update-policy.json.sig'}
              if not policy_paths.intersection(paths):
                  continue
              assert policy_paths.issubset(paths), 'Incomplete public update policy'
              policy = pathlib.Path(prefix + 'update-policy.json')
              signature = pathlib.Path(prefix + 'update-policy.json.sig')
              assert all(p.is_file() and not p.is_symlink() for p in (policy, signature)), 'Invalid public update policy files'
              document = policy.read_bytes()
              assert 0 < len(document) <= 8192 and 0 < signature.stat().st_size <= 2048, 'Public update policy exceeds limits'
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      assert key not in result, 'Duplicate policy field'
                      result[key] = value
                  return result
              data = json.loads(document, object_pairs_hook=unique)
              assert set(data) == {'schemaVersion', 'revision', 'issuedAt', 'minimumVersions', 'reason'}, 'Unknown update policy fields'
              assert type(data['schemaVersion']) is int and data['schemaVersion'] == 1 and type(data['revision']) is int and data['revision'] > 0, 'Invalid policy revision'
              minimum = data['minimumVersions']
              assert set(minimum) in ({'windows', 'android'}, {'windows', 'android', 'linux'}), 'Unknown policy platform'
              if scope == 'shared':
                  assert set(minimum) == {'windows', 'android'}, 'Separate platform policy required'
              else:
                  assert minimum['windows'] is None and minimum['android'] is None, 'Platform policy affects another platform'
                  assert 'linux' not in minimum or minimum['linux'] is not None, 'Unset platform minimum must be omitted'
              assert all(value is None or isinstance(value, str) and re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', value) for value in minimum.values()), 'Invalid minimum version'
              signer = pathlib.Path('.github/signers').read_text().strip().split()
              assert len(signer) == 4 and signer[0] == '119267804+ozimellow@users.noreply.github.com' and signer[1] == 'namespaces="git"' and signer[2] == 'ssh-ed25519', 'Unexpected public publisher identity'
              with tempfile.TemporaryDirectory(prefix='public-policy-trust-') as temp:
                  allowed_signers = pathlib.Path(temp) / 'allowed_signers'
                  allowed_signers.write_text(signer[0] + ' namespaces="kin-client-update-policy" ' + ' '.join(signer[2:]) + chr(10))
                  subprocess.run(['ssh-keygen', '-Y', 'verify', '-f', str(allowed_signers), '-I', signer[0], '-n', 'kin-client-update-policy', '-s', str(signature)], input=document, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          PY
      - name: Add and independently verify the approved platform
        if: inputs.operation == 'add_platform'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release.py --add-platform "releases/linux/v$RELEASE_VERSION/release.json" "$STAGING_RELEASE_ID"
      - name: Replace and independently verify the approved Windows package
        if: inputs.operation == 'replace_windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release.py --replace-windows "releases/windows/v$RELEASE_VERSION/release.json" "$STAGING_ASSET_IDS"
      - name: Record this run's approval
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil
          assert os.environ['APPROVE_PUBLICATION'] == 'true'
          source = pathlib.Path('releases') / ('v' + os.environ['RELEASE_VERSION'])
          metadata = json.loads((source / 'release.json').read_text())
          assert metadata['tag'] == 'v' + os.environ['RELEASE_VERSION']
          assert metadata['manualAcceptance'] is False
          metadata['manualAcceptance'] = True
          approved = pathlib.Path(os.environ['RUNNER_TEMP']) / 'approved-release'
          approved.mkdir()
          (approved / 'release.json').write_text(json.dumps(metadata) + '\n')
          shutil.copyfile(source / 'release.md', approved / 'release.md')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Approved for publication by @' + os.environ['GITHUB_ACTOR'] + '\n\n')
              summary.write('Version: `' + metadata['tag'] + '`\n\n')
              summary.write('Commit: `' + os.environ['GITHUB_SHA'] + '`\n\n')
              packages = metadata.get('reviewedPackages', {'package': metadata.get('reviewedPackageSha256')})
              for name, checksum in sorted(packages.items()):
                  summary.write(name + ' SHA-256: `' + checksum + '`\n\n')
              summary.write('Notes SHA-256: `' + metadata['reviewedNotesSha256'] + '`\n')
          PY
      - name: Verify staged download
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,targetCommitish > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          r = json.load(open(os.environ['RUNNER_TEMP'] + '/release.json'))
          assert r['isDraft'] is True
          assert r['isPrerelease'] == ('-dev.' in os.environ['RELEASE_VERSION'])
          assert r['targetCommitish'] == os.environ['EXPECTED_COMMIT']
          assert r['tagName'] == 'v' + os.environ['RELEASE_VERSION']
          PY
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/candidate"
          python3 .github/scripts/verify-release.py "$RUNNER_TEMP/approved-release/release.json" "$RUNNER_TEMP/candidate"
      - name: Publish the verified release
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)" = "$EXPECTED_COMMIT"
          if [[ "$RELEASE_VERSION" == *-dev.* ]]; then
            gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true --latest=false --title "v$RELEASE_VERSION" --notes-file "releases/v$RELEASE_VERSION/release.md"
          else
            gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --title "v$RELEASE_VERSION" --notes-file "releases/v$RELEASE_VERSION/release.md"
          fi
      - name: Verify published downloads
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
          python3 .github/scripts/verify-release.py "$RUNNER_TEMP/approved-release/release.json" "$RUNNER_TEMP/published"
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,tagName,targetCommitish > "$RUNNER_TEMP/published-release.json"
          python3 - <<'PY'
          import json, os
          r = json.load(open(os.environ['RUNNER_TEMP'] + '/published-release.json'))
          assert r['isDraft'] is False
          assert r['isPrerelease'] == ('-dev.' in os.environ['RELEASE_VERSION'])
          assert r['tagName'] == 'v' + os.environ['RELEASE_VERSION']
          assert r['targetCommitish'] == os.environ['EXPECTED_COMMIT']
          print(r['url'])
          PY
