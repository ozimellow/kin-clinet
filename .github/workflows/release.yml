      - name: Preserve previous verified downloads and correction receipt
        if: always() && env.RELEASE_OPERATION == 'replace_windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-correction-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-replacement/original/
            ${{ runner.temp }}/windows-replacement/receipt.json
          if-no-files-found: warn
          retention-days: 30
