name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted release version (for example 0.1.0)
        required: true
        type: string
      expected_commit:
        description: Exact reviewed and signed public commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ozimellow/kin-clinet' && github.actor == 'ozimellow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publication identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/signers
          test "$(git log -1 --format='%an|%ae|%cn|%ce')" = 'ozimellow|119267804+ozimellow@users.noreply.github.com|ozimellow|119267804+ozimellow@users.noreply.github.com'
          test "$(git for-each-ref --format='%(taggername)|%(taggeremail:trim)' "refs/tags/v$RELEASE_VERSION")" = 'ozimellow|119267804+ozimellow@users.noreply.github.com'
          git verify-commit HEAD
          git verify-tag "v$RELEASE_VERSION"
          test "$(git rev-parse "v$RELEASE_VERSION^{commit}")" = "$EXPECTED_COMMIT"
          test -f "releases/v$RELEASE_VERSION/release.json"
          test -f "releases/v$RELEASE_VERSION/release.md"
          python3 - <<'PY'
          import subprocess
          allowed = {'.gitignore', '.gitattributes', 'LICENSE', 'README.md', 'logo.svg', 'logo-dark.svg',
                     '.github/workflows/release.yml', '.github/signers', '.github/scripts/verify-release.py'}
          import re
          paths = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD']).decode().splitlines()
          assert all(p in allowed or re.fullmatch(r'releases/v\d+\.\d+\.\d+/release\.(json|md)', p) for p in paths), 'Unexpected public source path'
          PY
      - name: Verify staged download
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          r = json.load(open(os.environ['RUNNER_TEMP'] + '/release.json'))
          assert r['isDraft'] is True and r['isPrerelease'] is False
          assert r['tagName'] == 'v' + os.environ['RELEASE_VERSION']
          PY
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/candidate"
          python3 .github/scripts/verify-release.py "releases/v$RELEASE_VERSION/release.json" "$RUNNER_TEMP/candidate"
      - name: Publish the verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --title "v$RELEASE_VERSION" --notes-file "releases/v$RELEASE_VERSION/release.md"
      - name: Verify published downloads
        shell: bash
        run: |
          set -euo pipefail
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
          python3 .github/scripts/verify-release.py "releases/v$RELEASE_VERSION/release.json" "$RUNNER_TEMP/published"
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json url,isDraft,tagName
